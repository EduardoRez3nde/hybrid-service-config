spring:
  port: 8087
  datasource:
    url: jdbc:postgresql://db:5432/optimization_service_db
    username: ${POSTGRES_USERNAME_OPTIMIZATION_SERVICE}
    password: ${POSTGRES_PASSWORD_OPTIMIZATION_SERVICE}
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      acks: all
      retries: 100
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: "notification-service-consumer-group"
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: >-
          user-device-registered:com.rezende.notification_service.dto.DeviceRegisteredEventDTO,
          driver-assigned-to-ride:com.rezende.notification_service.event.DriverAssignedEvent
    listener:
      ack-mode: manual
      type: single
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migrations
  neo4j:
    uri: bolt://neo4j:7687
    migrations:
      locations-to-scan:
        - neo4j/migrations
      validate-on-startup: true
      autoclose-connection: true
    authentication:
      username: ${POSTGRES_USERNAME_OPTIMIZATION_SERVICE}
      password: ${POSTGRES_PASSWORD_OPTIMIZATION_SERVICE}
  data:
    redis:
      host: redis
      ports: 6379
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp_use_jdbc_metadata_defaults: false
  elasticsearch:
    uris: http://elasticsearch:9200
    connection-timeout: 1s
    socket-timeout: 30s
timefold:
  solver:
    termination:
      spent-limit: 30s
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/