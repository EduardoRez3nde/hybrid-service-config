server:
  port: 8086
firebase:
  config:
    service-account: /app/config/firebase/serviceAccountKey.json
aws:
  region: 'us-east-1'
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
app:
  kafka:
    topics:
      driver-assigned-ride-event: driver.assigned.ride.event.v1
      user-device-registrations: user.device.registrations.v1
  aws:
    sns:
      topic-arn: ${SNS_TOPIC_ARN}
      fcm-platform-application-arn: ${FCM_PLATFORM_ARN}
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://notification-db:5432/notification_service_db
    username: ${POSTGRES_USERNAME_NOTIFICATION_SERVICE:-admin}
    password: ${POSTGRES_PASSWORD_NOTIFICATION_SERVICE:-admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migrations
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      acks: all
      retries: 100
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: "notification-service-consumer-group"
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: >-
          user-device-registered:com.rezende.notification_service.dto.DeviceRegisteredEventDTO,
          driver-assigned-to-ride:com.rezende.notification_service.event.DriverAssignedEvent
    listener:
      ack-mode: manual
      type: single
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
